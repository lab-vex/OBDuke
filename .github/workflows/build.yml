# Builds the ESP32 firmware and the Android app on every push.
# Download the results from the run's "Artifacts" section.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Firmware logic tests (simulated Duke)
        run: ./test/run.sh

      - name: KTM CAN ID table is valid and the generated copies are up to date
        run: python3 tools/gen_can_ids.py --check

      - name: KTM CAN ID decoder (web page copy)
        run: node test/test_known_ids.js

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --warnings default \
            --output-dir out \
            firmware/obduke
          ls -la out

      - name: Name the binaries
        run: |
          mkdir dist
          cp out/obduke.ino.bin dist/obduke-firmware.bin
          # merged = bootloader + partitions + app, flash at 0x0 with any ESP flasher
          if [ -f out/obduke.ino.merged.bin ]; then cp out/obduke.ino.merged.bin dist/obduke-firmware-full.bin; fi

      - uses: actions/upload-artifact@v4
        with:
          name: obduke-firmware
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Every build is signed with the same permanent key so the app can update itself.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.OBDUKE_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.OBDUKE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            # strip any spaces / line breaks picked up when pasting the secrets
            printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/obduke.jks" \
              || { echo "::error::OBDUKE_KEYSTORE_B64 isn't valid base64 - re-paste it"; exit 1; }
            PW=$(printf '%s' "$KS_PW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            keytool -list -keystore "$RUNNER_TEMP/obduke.jks" -storepass "$PW" -alias obduke >/dev/null 2>&1 \
              || { echo "::error::Signing key won't open: OBDUKE_KEYSTORE_PASSWORD doesn't match OBDUKE_KEYSTORE_B64 (check for typos or a truncated paste)"; exit 1; }
            echo "::add-mask::$PW"
            echo "OBDUKE_KEYSTORE=$RUNNER_TEMP/obduke.jks" >> "$GITHUB_ENV"
            echo "OBDUKE_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Repo secret OBDUKE_KEYSTORE_B64 isn't set, so a release can't be signed"; exit 1
            fi
            echo "::warning::No signing secret: this APK uses a throwaway debug key and can't update a release install"
          fi

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          tag="${GITHUB_REF_NAME#v}"
          [ "$app" = "$tag" ] || { echo "::error::Tag $GITHUB_REF_NAME but app versionName is $app"; exit 1; }

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # Turn compile errors into annotations, readable without downloading the full log
      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Execution failed|^> [^T]|keystore|signing" "$RUNNER_TEMP/gradle.log" \
            | grep -v "^> Run with\|^> Get more help" | head -25 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Name the APK
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/obduke-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: obduke-app
          path: dist/

  # Auto-release: a push to main with a new versionName publishes v<versionName> with the APK and
  # firmware attached. Pushes that don't change the version (tag already exists) do nothing.
  release:
    needs: [tests, firmware, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: New version?
        id: ver
        env:
          HAS_KEY: ${{ secrets.OBDUKE_KEYSTORE_B64 != '' }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released, nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEY" != "true" ]; then
            echo "::error::Not releasing v$v: repo secret OBDUKE_KEYSTORE_B64 isn't set, so the APK isn't release-signed"; exit 1
          else
            echo "Releasing v$v"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
